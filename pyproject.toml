[project]
name = "vision-desktop-automation"
version = "0.1.0"
description = "Vision-based desktop automation with dynamic icon grounding using ScreenSeekeR (arXiv 2504.07981)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "mss>=9.0",
    "pillow>=10.0",
    "pyautogui>=0.9.54",
    "google-genai>=1.16.0",
    "opencv-python>=4.8",
    "requests>=2.31",
    "loguru>=0.7",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pywin32>=306",
    "pyperclip>=1.8",
    "boto3>=1.34.0",
    "requests>=2.31.0",
    "groq>=1.6.0",
    "pymupdf>=1.28.2",
]

[project.optional-dependencies]
# Only if you have a GPU and want OS-Atlas-7B instead of Gemini grounder
gpu-model = [
    "transformers>=4.40",
    "torch>=2.0",
    "accelerate>=0.27",
    "qwen-vl-utils>=0.0.8",
]
# For Ollama-based grounder (CPU-friendly, needs Ollama installed separately)
ollama-model = [
    "ollama>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
automate = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
